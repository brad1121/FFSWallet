name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  SDK_MODULE: github.com/brad1121/bitcoinsv-sdk-go
  SDK_REPO: git@github.com:brad1121/bitcoinsv-sdk-go.git
  GOPRIVATE: github.com/brad1121/bitcoinsv-sdk-go
  GONOSUMDB: github.com/brad1121/bitcoinsv-sdk-go

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: macOS
            os: macos-latest
            target: darwin
          - name: Windows
            os: windows-latest
            target: windows

    steps:
      - name: Checkout wallet
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Windows desktop dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add Windows compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure SDK deploy key
        shell: bash
        env:
          SSH_KEY_SDK: ${{ secrets.SSH_KEY_SDK }}
        run: |
          if [ -z "$SSH_KEY_SDK" ]; then
            printf '%s\n' 'Missing SSH_KEY_SDK secret. Add read-only deploy key private half from SDK repo.'
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY_SDK" > ~/.ssh/id_sdk
          chmod 600 ~/.ssh/id_sdk
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_sdk
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Fetch private SDK
        shell: bash
        run: |
          if command -v cygpath >/dev/null 2>&1; then
            SDK_DIR="$(cygpath -m "$RUNNER_TEMP")/bitcoinsv-sdk-go"
          else
            SDK_DIR="$RUNNER_TEMP/bitcoinsv-sdk-go"
          fi

          git clone --depth 1 "$SDK_REPO" "$SDK_DIR"
          go mod edit -replace "$SDK_MODULE=$SDK_DIR"
          go mod download

      - name: Test
        shell: bash
        run: go test ./...

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          goarch="$(go env GOARCH)"
          icon="$PWD/assets/icon.png"
          if command -v cygpath >/dev/null 2>&1; then
            icon="$(cygpath -m "$icon")"
          fi

          go run fyne.io/tools/cmd/fyne@latest package \
            --target "${{ matrix.target }}" \
            --name FFSWallet \
            --icon "$icon" \
            --app-id com.ffswallet.desktop \
            --release \
            --src ./cmd/ffswallet

          case "${{ runner.os }}" in
            Linux)
              mv FFSWallet.tar.xz "release/FFSWallet-linux-${goarch}.tar.xz"

              appdir="$PWD/AppDir"
              mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
              tar -xJf "release/FFSWallet-linux-${goarch}.tar.xz"
              cp ffswallet/usr/local/bin/ffswallet "$appdir/usr/bin/ffswallet"
              cp ffswallet/usr/local/share/applications/com.ffswallet.desktop.desktop "$appdir/FFSWallet.desktop"
              if ! grep -q '^Categories=' "$appdir/FFSWallet.desktop"; then
                printf '%s\n' 'Categories=Office;Finance;' >> "$appdir/FFSWallet.desktop"
              fi
              cp ffswallet/usr/local/share/pixmaps/com.ffswallet.desktop.png "$appdir/com.ffswallet.desktop.png"
              cp ffswallet/usr/local/share/pixmaps/com.ffswallet.desktop.png "$appdir/usr/share/icons/hicolor/256x256/apps/com.ffswallet.desktop.png"
              cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/usr/bin/ffswallet" "$@"
          EOF
              chmod +x "$appdir/AppRun" "$appdir/usr/bin/ffswallet"

              case "$goarch" in
                amd64) appimage_arch=x86_64 ;;
                arm64) appimage_arch=aarch64 ;;
                *) appimage_arch="$goarch" ;;
              esac

              appimagetool="$RUNNER_TEMP/appimagetool-${appimage_arch}.AppImage"
              curl -fsSL -o "$appimagetool" "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${appimage_arch}.AppImage"
              chmod +x "$appimagetool"
              APPIMAGE_EXTRACT_AND_RUN=1 ARCH="$appimage_arch" "$appimagetool" "$appdir" "release/FFSWallet-linux-${goarch}.AppImage"
              ;;
            macOS)
              ditto -c -k --keepParent FFSWallet.app "release/FFSWallet-macos-${goarch}.zip"
              ;;
            Windows)
              powershell.exe -NoProfile -Command "Compress-Archive -Path 'FFSWallet.exe' -DestinationPath 'release/FFSWallet-windows-${goarch}.zip' -Force"
              ;;
          esac

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFSWallet-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate checksums and Linux signatures
        shell: bash
        run: |
          set -euo pipefail

          cd release
          sha256sum * > SHA256SUMS

          for file in FFSWallet-linux-* SHA256SUMS; do
            [ -f "$file" ] || continue
            cosign sign-blob --yes \
              --output-signature "$file.sig" \
              --output-certificate "$file.pem" \
              "$file"
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
