name: Pages

on:
  # A release published by the Release workflow does NOT fire this event:
  # GitHub does not let events generated with GITHUB_TOKEN trigger further
  # workflows, so the mirror is driven by workflow_call from Release instead.
  # This trigger still covers a release published by hand or by a PAT.
  release:
    types:
      - published
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallet
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/build-pages.sh public-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    name: Deploy Pages Site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
